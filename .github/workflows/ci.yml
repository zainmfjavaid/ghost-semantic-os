name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install source and CI dependencies
        run: |
          ./semantic-os bootstrap --source-only
          python -m pip install --quiet -r requirements/ci.lock
      - name: Package and protocol tests
        env:
          GHOST_TEST_PYTHON: python
        run: ./semantic-os test --full
      - name: Verify release metadata
        run: python scripts/build-release-manifest.py --check
